
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Perusahaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/css/lightbox.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/js/lightbox-plus-jquery.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .masonry {
      column-count: 1;
    }
    @media (min-width: 640px) {
      .masonry {
        column-count: 2;
        column-gap: 1rem;
      }
    }
    @media (min-width: 1024px) {
      .masonry {
        column-count: 3;
        column-gap: 1.5rem;
      }
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
    }
    .masonry-item img,
    .masonry-item video,
    .masonry-item iframe {
      width: 100%;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="text-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <a href="index.html" class="back-button bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Kembali ke Beranda
      </a>
       <h1 class="text-3xl font-bold text-blue-600 mb-8 text-center">Galeri Perusahaan</h1>
    </div>
<body class="text-gray-700">

  <div class="max-w-6xl mx-auto px-4 py-12">
     <div class="masonry">
      <!-- Foto -->
      <div class="masonry-item"><a href="img/Foto1.jpg" data-lightbox="galeri"><img src="img/Foto1.jpg" alt="Foto Galeri 1"></a></div>
      <div class="masonry-item"><a href="img/Foto2.jpg" data-lightbox="galeri"><img src="img/Foto2.jpg" alt="Foto Galeri 2"></a></div>
      <div class="masonry-item"><a href="img/Foto3.jpg" data-lightbox="galeri"><img src="img/Foto3.jpg" alt="Foto Galeri 3"></a></div>
      <div class="masonry-item"><a href="img/Foto4.jpg" data-lightbox="galeri"><img src="img/Foto4.jpg" alt="Foto Galeri 4"></a></div>
      <div class="masonry-item"><a href="img/Foto5.jpg" data-lightbox="galeri"><img src="img/Foto5.jpg" alt="Foto Galeri 5"></a></div>
      <div class="masonry-item"><a href="img/Foto6.jpg" data-lightbox="galeri"><img src="img/Foto6.jpg" alt="Foto Galeri 6"></a></div>
      <div class="masonry-item"><a href="img/Foto7.jpg" data-lightbox="galeri"><img src="img/Foto7.jpg" alt="Foto Galeri 7"></a></div>

      <!-- Video lokal -->
      <div class="masonry-item"><video controls><source src="video/Video1.mp4" type="video/mp4"></video></div>
      <div class="masonry-item"><video controls><source src="video/Video2.mp4" type="video/mp4"></video></div>
      <div class="masonry-item"><video controls><source src="video/Video3.mp4" type="video/mp4"></video></div>
      <div class="masonry-item"><video controls><source src="video/Video4.mp4" type="video/mp4"></video></div>
      <div class="masonry-item"><video controls><source src="video/Video5.mp4" type="video/mp4"></video></div>
      <div class="masonry-item"><video controls><source src="video/Video6.mp4" type="video/mp4"></video></div>

      <!-- Video YouTube -->
      <div class="masonry-item">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video Galeri YouTube" allowfullscreen class="aspect-video"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
